<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر أيمن</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}body{background:#f5f5f5}header{background:#111;color:#fff;padding:20px;text-align:center}header p{color:#ffcc00;margin-top:8px}.container{padding:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}.card img{width:100%;height:240px;object-fit:cover}.card-body{padding:12px}.price{color:#e60000;font-weight:bold;margin-top:5px;font-size:18px}.btn{display:block;background:#25D366;color:#fff;text-align:center;padding:10px;border-radius:8px;margin-top:10px;text-decoration:none;font-weight:bold}footer{text-align:center;padding:20px;color:#777}</style>
</head>
<body>
<header><h1>🔥 متجر أيمن 🔥</h1><p id="subtitle"></p></header>
<div class="container" id="products"></div>
<footer id="footer"></footer>
<script>
// =============================
// 👇 عدل هنا فقط 👇
// =============================
const WHATSAPP_NUMBER = "249998948562";
const STORE_DESC = "أمدرمان - توصيل لكل السودان";
const PRODUCTS = [
  {name: "جلابية سودانية فاخرة", price: "15,000 جنيه", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400"},
  {name: "تيشيرت رجالي قطن", price: "8,000 جنيه", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},
  {name: "عباية نسائية", price: "22,000 جنيه", img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400"},
  {name: "قميص شبابي", price: "12,000 جنيه", img: "https://images.unsplash.com/photo-1603252109303-2751441dd157?w=400"}
];
// =============================
// 👆 انتهى التعديل 👆
// =============================
document.getElementById('subtitle').innerText = STORE_DESC;
document.getElementById('footer').innerHTML = "واتساب: 0" + WHATSAPP_NUMBER.slice(3);
const container = document.getElementById('products');
PRODUCTS.forEach(p=>{
  const txt = encodeURIComponent("السلام عليكم، عايز اطلب: " + p.name + " - " + p.price);
  container.innerHTML += `<div class="card"><img src="${p.img}"><div class="card-body"><h3>${p.name}</h3><div class="price">${p.price}</div><a class="btn" href="https://wa.me/${WHATSAPP_NUMBER}?text=${txt}">اطلب عبر واتساب</a></div></div>`;
});
</script>
</body>
</html>
